# Smart Taxi Agent configuration. Missing keys fall back to the defaults in AppConfig.
map.file=data/maps/default.csv

q.alpha=0.1
q.gamma=0.99
q.epsilon.start=1.0
q.epsilon.min=0.05
q.epsilon.decay=0.999

training.episodes=5000
training.maxStepsPerEpisode=200
# leave empty for a random seed
training.seed=

reward.step=-1
reward.illegal=-10
reward.dropoff=20

fare.base=5
fare.perCell=2
fare.costPerStep=0.5
fare.peak.multiplier=1.5
fare.useInReward=false

history.sampleEvery=50
ui.refreshEveryEpisodes=20

db.url=jdbc:sqlite:data/taxi.db
agent.file=data/agent.ser

log.file=logs/app.log
log.level=INFO
